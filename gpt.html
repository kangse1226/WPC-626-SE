<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Xiaomi Watch S4 모바일 페이지</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="header">
    <h1>Xiaomi Watch S4</h1>
  </header>

  <main>
    <!-- Hero Section -->
    <section class="section hero">
      <div class="img-box"><!-- Hero 이미지 --></div>
    </section>

    <!-- 제품 소개 -->
    <section class="section intro">
      <h2>Timeless by design</h2>
      <div class="img-box"><!-- 시계 전면 이미지 --></div>
    </section>

    <!-- 디테일 강조 -->
    <section class="section detail">
      <h3>빛으로 완성된 정교함</h3>
      <div class="img-box"><!-- 디테일 클로즈업 이미지 --></div>
    </section>

    <!-- 스타일 연출 -->
    <section class="section style">
      <h3>손목 위에서 스타일을 완성하다</h3>
      <div class="img-box"><!-- 착용 이미지 --></div>
    </section>

    <!-- 기능 소개 -->
    <section class="section features">
      <h3>스마트한 기능, 감각적인 디자인</h3>
      <div class="img-box"><!-- 기능 이미지 --></div>
    </section>

    <!-- 건강 모니터링 -->
    <section class="section health">
      <h3>함께하는 나의 건강 파트너</h3>
      <div class="img-box"><!-- 운동/건강 관련 이미지 --></div>
    </section>

    <!-- 마무리 CTA -->
    <section class="section cta">
      <h3>일상에 스마트하게 스며들다</h3>
      <div class="img-box"><!-- 제품 착용 컷 --></div>
      <button class="buy-btn">지금 구매하기</button>
    </section>
  </main>

  <footer class="footer">
    <p>© 2025 Xiaomi Korea</p>
  </footer>
</body>
</html>
