<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JS1. 자바스크립트 기본 + DOM선택법</title>

    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        /* 보이는 화면에 채우기 */
      }
      body {
        overflow: hidden;
      }

      .pbox {
        position: absolute;
        top: 0;
        left: 0;
        /* 부모는? window(보이는화면) */
        margin: 0;
        padding: 0;

        width: 500px;
        height: 500px;
        padding-top: 200px;

        /* 글자 */
        line-height: 50px;
        font-size: 30px;
        text-align: center;
        /* 줄바꿈방지 */
        white-space: nowrap;

        border: 4px solid rgb(194, 168, 255);
        /* 보더박스:보더,패딩포함 */
        box-sizing: border-box;
      }
    </style>

<!-- 자바스크립트 코딩구역! -->
 <script>
  // 인터널 자바스크립트 코딩 구역 html안에 잇으니 인터널 ///

  // 함수 만들기////// (){} 옆구리 터지면 안돼
  // 함수형식-> fuction 함수명(){코드구역}
  function 김비서나와라(){

// 1. 함수호출확인!
console.log('연봉 올려주세요!');

// 2. 변경대상에 변경반영하기
// 2-1. 배경이미지 넣기 
document.getElementsByClassName('pbox')
// 클래스는 여러개일수 있으므로 0부터 시작!
.item(0)
// CSS 배경 변경하기
.style.background = 'url(./images/kimbs.jpg) no-repeat top/cover';


  } /////////// 김비서나와라 함수의 끝//////////
  ///////////////////////////////////////////





  // ///////////////////////////////////////////////////////
 </script>
<!--  -->
  </head>
  <body>
    <!-- 드라마 소개박스 -->
    <p 
    class="pbox" 
    title="클릭하면 김비서 등장!"
    onclick="
    // onclick 이벤트 속성은 js와 연결되는 기본속성이다!
    // 이벤트 속성 이름은 아래와 같이 구성된다!
    // -> on+이벤트명 예. onclick, onmouseover ...
    // 이벤트 속성은 모든 html 요소에 줄 수 있다!
    // 이구역은 JS 코드구역임
    // 여기는 JS 문법만 적용됨
    // JS 한줄주석 : 현업에서는 이렇게 안하는데, 자바스크립트 이해하기 위해 여기다가 먼저 해보기

    // 경고창 띄우기
    // alert('김비서! 어서 나와!!');

    // 콘솔찍기
    console.log('클릭했네~!!');

    // JS는 전체 HTML의 지도를 가지고 있음
    // 그 지도명을 document라고 한다!
    document
    // 가져온 요소들 중 id 명으로 된 요소를 선택한다!
    // getElementById(아이디명)
    // document 하위 요소 선택시 점(.)을 찍는다!!
    // 아이디로 엘러먼트를 하나 가져와. 
    // -> get 가져와 Element 요소를 By Id 아이디로
    .getElementById('name')
    // 하위로 내려갈 때 점(.)
    // innerHTML = 코드 
    // JS에서 이퀄(=)은 이퀄 오른쪽의 값이 이퀄 왼쪽으로 들어감을 의미하낟.
    // innerHTML은 inner 안쪽에 HTML 태그를 넣는 속성
    // 오른쪽 값을 감싸줄때 백틱(`````````)으로 싸고 
    // 내부 속성값은 홑따옴표를 사용하여 
    // 가장 바깥쪽의 쌍따옴표와 충돌을 막는다
    .innerHTML=`
    <img 
    src='./images/kim.png' 
    alt='김비서가 왜그럴까?'>
    `;
// 따옴표 규칙
// 따옴표 내부에 같은 따옴표를 쓸 수 없다 
// 쌍따옴표 내부에 홑따옴표
// 홑따옴표 내부에 쌍따옴표
// 쌍따옴표 또는 홑따옴표 내부에 백틱
// 그래서 `백틱 너무 유용쓰

// 나머지 기능은 외부 함수를 호출해서 구현하자!
// 함수란 무엇일까? 에프엑스  함 해보슈(수)
// -> 함수는 특정 명령문을 호출할 때 실행하는 코드저장소
// 호출은 함수 이름으로 호출한다!
// 호출시 소괄호()를 뒤에 사용한다

김비서나와라();
    "
    >
      나는 요즘 매일 생각한다. <br />
      도대체 <span id="name"></span>
    </p>
      <!-- p요소 안에는 div 넣을 수 없음! -->
  </body>
</html>
