<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>전연화퇴근해</title>
<!-- 글꼴 가져올 CSS -->
    <link rel="stylesheet" href="../007.JS학습/글꼴가져올.css">
    <!-- 아이콘추가 -->
      <link
      rel="shortcut icon"
      href="../005.CSS학습/03.Animation/debutordie/데못죽/logo.webp"
      type="image/ico"
    />

    <style>
       @font-face{
                font-family: 빛의계승자;
                src: url(./fonts/HeirofLightBold.woff2) format("woff2"),
        
        
            }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        /* 보이는 화면에 채우기 */
      }
      body {
        overflow: hidden;
      }

      .pbox {
        position: absolute;
        top: 50%;
        left: 50%;
        translate: -50% -50%;
        /* 부모는? window(보이는화면) */
        margin: 0;
        padding: 0;

        width: 500px;
        height: 500px;
        padding-top: 200px;

        /* 글자 */
        line-height: 50px;
        font-size: 30px;
        text-align: center;
        /* 줄바꿈방지 */
        white-space: nowrap;

        border: 2px solid rgb(250, 212, 236);
        /* 보더박스:보더,패딩포함 */
        box-sizing: border-box;
        background: url(../005.CSS학습/뉴진스/뉴진스\ \(1\).jpeg) no-repeat top/cover;
        /* 자스영역에 넣을거 */
        /* background: url(../005.CSS학습/03.Animation/debutordie/데못죽/md.png) no-repeat top/cover; */
      }
    </style>

<!-- 자바스크립트 코딩구역! -->
 <script>
  // 함수형식-> fuction 함수명(){코드구역}
  function 오늘의메뉴(그릇){
    // (메모리주소)

// 1. 함수호출확인!
console.log('아아 얼음 많이주세요!'+그릇);

// 피박스 변수 만들기
var 피박스 = 
document
.getElementsByClassName('pbox')
.item(0)

// 2. 변경대상에 변경반영하기
// 2-1. 배경이미지 넣기 
피박스.style.background = 'url(../005.CSS학습/03.Animation/debutordie/데못죽/ah.png) no-repeat top/cover';
// 2-2. 글자색 변경하기
피박스.style.color = 'white';
// 2-3.글자그림자넣기
피박스.style.textShadow = '1px 1px 1px gray';
// 2-4. 박스 둥글게 만들기
피박스.style.borderRadius = '50%';
// 2-5. 트랜지션 넣기
피박스.style.transition = '3s';

// 글꼴
피박스.style.fontFamily = '빛의계승자';
피박스.style.fontSize = '50px';
피박스.style.lineHeight = '0';

// 2-6. 회전: 720deg=2turn 두바퀴회전. +-로 시계반시계 방향설정
피박스.style.rotate = '2turn';

// 2-7. 중앙이동:
피박스.style.top = '50%';
피박스.style.left = '50%';

// 2-8. 트랜스폼으로 중앙이동하기- 트랜스레이트마오마오
피박스.style.translate = '-50% -50%';

// body요소를 메모리공간주소에 넣기
var 바디 = document.body;

// 2-9. 바디에 배경색 넣기
바디.style.backgroundColor = 'rgb(250, 212, 236)';
// 2-10. 천천히 바뀌게 하기
바디.style.transition = '5s';

// 요청 클래스 요소를 메모리공간주소에 담기(밑에 요청 클래스를 만들엇음 )
var 요청 = document.getElementsByClassName('요청').item(0);
// 2-11. 김비서에 요청내용 찍기-> 주머니 사용
// innerText 속성은 요소 내부 데이터로 문자열을 넣는역할
요청.innerText = 주머니;

// 2-12. 요청 클래스 요소에 css 한번에 넣기
// cssText속성: css설정값을 한번에 넣는 속성
// !!!! `백틱쓰면 엔터가능
요청.style.cssText = `
    position: absolute;
    top: 0;
    right: -51px;
    border: 4px solid skyblue;
    background-color: white;
    padding: 20px;
    rotate: 20deg;
    color: darkslategrey;
    
`;





  } /////////// 김비서나와라 함수의 끝//////////
  ///////////////////////////////////////////

 </script>
<!--  -->
  </head>
  <body>
    <!-- 드라마 소개박스 -->
    <p 
    class="pbox" 
    title="클릭하면 선아현 등장!!"
    onclick="
    // 콘솔찍기
    console.log('클릭했네~!!');
    document
    .getElementById('name')
    .innerHTML=`
    <img 
    src='../005.CSS학습/03.Animation/debutordie/데못죽/md.png' 
    alt='문대'>
    `;

오늘의메뉴('빨리빨리줘요!');
    "
    >
      <!-- 아아!! <br /> -->
      얼음많이 샷추가!!
       <span id="name"></span>

      <!-- 김비서에게 전달된 요청 찍기 -->
       <b class="요청"></b>
    </p>
      <!-- p요소 안에는 div 넣을 수 없음! -->
  </body>
</html>
