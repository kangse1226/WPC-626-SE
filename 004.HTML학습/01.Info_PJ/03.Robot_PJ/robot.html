<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Robot PJ</title>
    <!-- 메인 CSS -->
    <link rel="stylesheet" href="./css/robot.css" />
  </head>
  <body>
    <!-- 1. 상단영역 헤더는 디아이브이친구임-->
    <!-- #top-area>header.top-area -->
    <div id="top-area">
      <header class="top-area"></header>
    </div>
    <!-- 2. 메인영역 메인은 한번밖에 못씀-->
    <!-- #main-area>main.main-area -->
    <div id="main-area">
      <main class="main-area">
        <!-- 2-1. 로봇박스 -->
        <section class="robot-box ">
          <!-- 2-1-1. 로봇머리 -->
          <div class="robot-head fur">
            <!-- 얼굴 -->
             <div class="face"></div>
            <!-- 왼쪽눈 -->
            <!-- .eye.eye1 -->
            <div class="eye eye1"></div>
            <!-- 오른쪽눈 -->
            <!-- .eye.eye2 -->
            <div class="eye eye2"></div>
            <!-- 코 -->
            <div class="nose"></div>
            <!-- 입 -->
            <div class="mouth"></div>
            <!-- 왼쪽귀 -->
            <div class="ear ear1"></div>
            <!-- 오른쪽귀 -->
            <div class="ear ear2"></div>
          </div>

          <!-- 2-1-2. 로봇몸통 -->
          <div class="robot-body fur">
            <!-- 목 -->
             <div class="neck fur"></div>
             <!-- 왼팔 -->
              <div class="arm arm1 fur"></div>
              <!-- 오른팔 -->
              <div class="arm arm2 fur"></div>
              <!-- 왼다리 -->
              <div class="leg leg1 fur"></div>
              <!-- 오른다리 -->
              <div class="leg leg2 fur"></div>
              <!-- TV -->
               <div class="tv"></div>
          </div>
        </section>
      </main>
    </div>
    <!-- 3. 하단영역 -->
    <!-- #bottom-area>footer.bottom-area -->
    <div id="bottom-area">
      <footer class="bottom-area"></footer>
    </div>
  </body>
</html>
