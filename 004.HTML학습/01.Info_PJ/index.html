<!DOCTYPE html>
<html lang="en">
  <!-- head요소: 웹페이지 기본 설정-->
  <head>
    <!-- 문자열 셋팅 -->
    <meta charset="UTF-8" />
    <!-- 모바일 크기처리(폰은 크기가 작으니까) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 탭메뉴출력 타이틀 -->
    <title>네이버 요약 뉴스</title>
    <!-- 스타일시트 인터널방식 코딩구역 -->
    <style>
      /* css문법만 사용하는 구역! ; 세미클론 없으면 큰일남 세미클론이 있어야 끝난걸 안다 */
      /* 기본문법: 선택자{속성:값;} */

      /* 기본값 초기화 - 마진,패딩 0 */
      html, body, h1, h2, h3, ul{
        margin: 0;
        padding: 0;
      }

      /* 1.상단영역 */
      .top-area {
        /* 가로크기 w - width: 크기값
         가로크기를 안주면 auto가 기본값, w숫자 쓰면 픽셀까지 나옴 */
         /* width: 1280px; */
          /* 크기를 주면 기본적으로 내부 컨텐트 영역의 크기이며 패딩과 보더는 바깥쪽에 생긴다!
          이런박스를 컨텐트 박스라고 한다! */

          /* 최대가로크기 maw (그냥w숫자하면 가로스크롤이 생기니까 maw숫자로 한다)*/
          max-width: 1280px;
          /* 효과는 1280px보다 부모박스 크기가 작아지면 auto로 전환되고, 이것보다 커지면 더이상 커지지 않고 크기를 유지함! */


          /* 보더박스 만들기(크기에 보더까지 포함) */
          box-sizing: border-box; 

          /* 블록요소 가로 중앙정렬하기 
          -> 양쪽 마진을 auto로 주면 된다! 
          마진 0 auto 가 유명함
          margin: 0 auto;  */
          margin: 0 auto;

        /* 테두리 bd - border: 두께 종류 색상 */
        border: 10px dotted #020077;
        /* 글자중앙정렬 tac */
        text-align: center;
        /* 패딩 p 패딩 셋팅법(마진도 동일함) 
        padding: 값;(4방향 공통)
         padding: 값 값; (위아래 양쪽)
          padding: 값 값 값; 위 양쪽 아래 
          padding: 값 값 값 값; 위 오른 아래 왼
        -> 물론 방향별 속성이 따로 있음
        /* padding-top, padding-bottom,padding-right, padding-left  */
        padding: 30px;

        /* 배경색 bgc */
        background-color: #dde4f8;
      }

      /* 메뉴박스 */
      /* .menu ul (메뉴 밑에 유엘) */
      .menu ul{
        /* 기본블릿없앰 */
        list-style: none;
        /* 자식요소 옆으로 흐르게 변경-> flex는 나중에 적용할 예정! 중요하기 때문 */
        /* display: flex; */
        /* 사이간격 조절 */
        /* gap: 10px; */
      }

      /* li 리스트 요소 */
      .menu li{
        /* 인라인 블록으로 display 변경: 이게 float보다 쉬움. 인라인으로 하면 위아래 마진이 안들어가서 인라인 블록으로 함*/
        display: inline-block;
        /* 패딩 p - padding: 위아래 양쪽 */
        padding: 0 5px;
      }

    </style>
  </head>
  <!-- body요소 : 웹문서 본문 출력 -->
  <body>
    <!-- 1. 상단영역 -->
    <header class="top-area">
      <!-- h1요소는 큰 제목 -->
      <h1 id="main-title">네이버 요약 뉴스</h1>

      <!-- div는 내용구분박스 -->
      <nav class="menu">
        <!-- css은 문법 잘 지켜야함/ style속성에 값으로 css를 셋팅할 수 있다 아랫줄처럼 이렇게 직접 넣는게 인라인방식 -->
        <!-- <ul style="list-style: none; display: flex; gap: 10px;"> -->
        <!-- ul요소는 순서 없는 리스트(unordered list) -> 하위필수요소는 li (반드시사용해야함!)-->
        <ul>
          <li>네이버로고</li>
          <li>경제</li>
          <li>사회</li>
          <li>IT/과학</li>
          <li>TV/연예</li>
        </ul>
      </nav>
    </header>

    <!-- 2. 메인영역 -->
    <main class="main-area">
      <!-- 메인 이미지 -->
      <img
        src="./images/Artboard 1.jpg"
        alt="내가 만든 네이버 뉴스 이미지"
        style="width: 100%"
      />
    </main>

    <!-- 3. 하단영역 -->
    <footer class="bottom-area">
      <!-- br요소: 줄바꿈 -->
      <address>
        서울시 강남구 역삼동 119 대호B 8F <br />
        대표: Tom Brace Parker <br />
        전화: 010-2222-3333
      </address>
    </footer>
    <!-- 
    주석 구역 
    [ HTML5에서 등장한 div 친구들 ]
        - div에 내용을 구분하는 이름을 지어줌
        - 의미가 있는요소를 시멘틱(sementic)태그라고 함!
        - div로만 나누기 말고 더 의미있게 구분하자 
        1. header : 머릿부분
        2. footer : 아랫부분
        3. main : 메인부분(한번만 사용가능!)
        4. nav : 네비게이션 부분
        5. aside : 부가정보
        6. section : 내용구분파트
        7. article : 독립된 내용구분파트
        ( section/article 내부에 h1~h6 태그사용권고)     
         
        [ 요소 명명법 ]
        1. 아이디는 #, 클래스는 . (약어로만들기)
        2. 이름은 구체적으로 만들고
        단어마다 데쉬(-)를 사용함(케밥케이스)
        3. 아이디는 유일함, 클래스는 다중적용가능
        예) <div class="aa bb cc" id="ee"></div>
        -클래스는 공백으로 구분하여 여러개 지정가능(그래서 - 로 구분안함)

        [ img 요소 ]
        - img 는 이미지를 불러오는 요소
        - 필수속성
            1) src : 이미지경로
            2) alt : 대체텍스트(웹접근성 필수)
            -> alternative text

        [ 요소의 구성 ]
        1. 요소명 - 요소별 특징을 구분하는 이름
        2. 속성 - 요소가 가지는 개별 셋팅값을 저장함
        -> 속성값은 쌍따옴표안에 표기함
        표기) <요소명 속성="값">
        -> 요소의 문자는 모두 소문자를 원칙으로 한다!


        [ 요소 공통속성 ]
        1. style 속성 : 요소에 인라인으로 CSS속성값을 셋팅함
        예) <요소명 style="속성:값;속성:값;">
        2. title 속성 : 툴팁제공속성(마우스오버시 등장)
    -->
  </body>
</html>
