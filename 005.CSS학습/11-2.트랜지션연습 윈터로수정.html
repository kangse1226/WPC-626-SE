<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>트랜지션 연습</title>
    <style>
        /* css 코드구역 */
        html, body{
            height: 100%;
        }
        body{
            /* background: url(./레벨/하츄핑배경.jpeg) no-repeat center/80%; */

            background-image: linear-gradient(to bottom, rgb(241, 230, 239), rgb(229, 156, 212) 30%, rgb(167, 238, 234) 30%);

        }

        /* 애니박스 */
        .ani-box{
            /* 부모자격 */
            position: relative;
            top: 10%;
            /* 비율박스 설정 */
            padding-top: 30%;
            /* height: 400px; 높이 지우고 탑을 비율로 바꾸고 패딩탑넣어줌 */
            /* 블록은 옆으로 끝까지 가니까 w 값 줄필요없음 */

            background: url(./레벨/륌.webp) no-repeat top/100%;

            /* 체크박스 선택해서 태우고 나갔을 때 자식요소 안보이게 숨기기 */
            overflow: hidden;

            outline: 2px solid rgb(5, 86, 192);
        }

        /* 윈터 박스 */
        #winter-box{
            position: absolute;
            /* 윈터가 처음에는 밖에 있어서 안보임 */
            right: -20%;
            /* 만약 원본이미지가 세로로 길어서 바텀이 0이면 위로 뜨고 픽셀음수로 수치조정해야함 */
            bottom: -10%;
            /* 가로세로크기는 내가 넣은 공유이미지에 따라 조절 브라우저에서 f12누르고
            직접찍어서 값 스크롤해서 조정하면 편함! */
            /* width: 504px; */
            /* height: 399px; */
            /* 픽셀로 했다가 퍼센트로 바꿨슨..
            width의 %값은 부모요소의 width에 대한 비다. 부모크기에 대한 40%란뜻임 */
            width: 40%;
            padding-top: 30%;
            /* 높이값이 없는 박스에서 패딩탑값이 퍼센트면 
            본 박스의 width크기에 대한 %다!!!!
            패딩의 속성을 기억해...  */

            /* 윈터가 하츄핑 위에오게 하려고 */
            z-index: 1;

            /* 윈터 배경 이미지-> 배경이미지는 css에서 변경가능하기 때문에
            이미지 요소 대신 박스 배경을 사용한다 */
            background: url(./레벨/윈터하츄핑타기전누끼.png) no-repeat center/50%;
           

        }
       

        /* 하츄핑 박스 */
        #ping-box{
            position: absolute;
            bottom:40%;
            left: 30%;
            width: 20%;
        }

        /* 하츄핑 이미지 조절 */
        #ping-box img{
            /* 부모박스를 채움 */
            width: 100%;
        }

        /* 라벨 디자인- 버튼형 */
        .btn-action{
        
            /* 체크박스가 인라인이어서 마진탑이 안먹힘 
            그래서 위아래마진보더 등 적용하기 위해
            디스플레이 인라인블록으로 바꿈 */
            display: inline-block;
            margin-top: 50px;
            padding: 20px;
            border: 3px solid #fd4179;
            border-radius: 20px;
            background-color: #3b2c36;
            color: #ffffff;
            
            /* 손가락 모양 커서 */
            cursor: pointer;
            
        }
        /* 가상요소로 버튼 글씨 넣기 */
        .btn-action::before{
            content: '💖루미한테 가자!';
            font-size: 20px;
        }
        
        /* 체크박스 체크시 버튼형 라벨 변경하기 */
        #chkbx:checked + .btn-action{
            border: 3px solid #be5ef5;
            background-color: #1d1342;
        }
        #chkbx:checked + .btn-action::before{
            content: '하츄하츄💗';
        }

        /* 체크박스 숨기기 */
        #chkbx{
            display: none;
        }

        /* 체크박스 체크시 winter-box 이동 애니
        -> 체크 박스 체크시 다음 형제요소들 중 .ani-box의 
        자손 #winter-box 선택 */
        #chkbx:checked ~ .ani-box #winter-box{
            /* 오른쪽 바깥으로 슝 나감 */
            right: 100%;
            width: 60%;
            /* 배경이미지를 태운 걸로 바꿈 */
            background-image: url(./레벨/윈터하츄핑탄후누끼.png);
            /* 트랜지션 trs : 4초, 배경이미지는 1초 기다렸다가 .1초동안 다른 이미지로 변경된다 */
            transition: 4s, background-image .1s 1s;
        }

        /* 체크박스 체크시 하츄핑 박스 1초 후 투명하게 변경하기 */
        #chkbx:checked ~ .ani-box #ping-box{
            /* 투명도 op -
             opacity: 0~1사이값 0은 투명 소수점은 반투명 1은 불투명 */
            opacity: 0;
            /* 트랜지션 trs */
            transition: 0.1s 1s;

        }


    </style>
</head>
<body>
    <!-- 체크박스 -->
    <input type="checkbox" id="chkbx">
    <!-- 라벨 -->
    <label for="chkbx" class="btn-action"></label>
    <!-- 체크박스가 라벨의 위에 있어야 함 css는 순서 꼭 생각을 해 
      -->

    <!-- 하츄핑이 윈터 손 타기 애니박스 -->
    <div class="ani-box">
        <!-- 윈터 박스 -->
         <div id="winter-box"></div>

         <!-- 하츄핑 박스 -->
          <div id="ping-box">
            <img src="./레벨/하츄핑누끼.png" alt="하츄핑">
          </div>

          <!--  윈터 손에 탄 하츄핑 -->
            <div id="winterping"></div>
    </div>
</body>
</html>
