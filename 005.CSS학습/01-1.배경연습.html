<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>01-1. 배경연습</title>
    <style>
      /* CSS 인터널 코딩 구역 */
      h1{
        /* 글자 중앙 정렬 tac */
        text-align: center;
        font-family: "Do Hyeon", sans-serif;
      }

      /* body 배경세팅하기 */
        body{
           /* 1. 배경색 bgc : background-color: 색;*/
          background-color: #e1ecf5;

          /* 2. 배경이미지 bgi -> background-image: url(이미지경로)
          기본적으로 배경이미지는 반복됨 */
          /* background-image: url(./); */

          background-image: url(./imgs/bg_logo_a_01.png);
        
          /* 3. 배경 반복 여부 bgr
          -> background-repeat: 옵션;
          -> 값: no-repeat/repeat-x(x축 반복)/repeat-y/repeat(기본값)  */
          background-repeat: no-repeat;

          /* 4. 화면 고정 bga
          -> background-attachment: fixed; 
          -> 스크롤시 배경이 보이는 화면에 고정됨 */
        background-attachment: fixed;
        
        /* 5. 배경 위치 bgp 포지션 
        -> background-posotion: x축 y축; 
        -> x축값: left/right/center(기본값)/수치값
        -> y축값: top/bottom/center(기본값)/수치값
        */
        background-position: top;

        /* 6. 배경 크기 bgz
        -> background-size: 값;
        -> 값: contain/cover/수치값
        : contain은 박스에 이미지 모두 보이기, cover은 박스에 비율맞춰 모두 채우기!!
        -> 값을 2개 쓰면 가로크기 세로크기 순서임 (가로쓰고 세로값 안쓰면 auto 비율)*/
        /* background-size: 400px 200px; */
        /* background-size: 400px auto; */
        /* background-size: 400px; */
        /* background-size: auto 400px; */
        background-size: 200px auto; 

        /* 화면 고정 테스트를 위해 높이값 주기 */
        height: 3000px;
        }

        /* .wrap박스에 배경 여러개 넣기 */
        .wrap{
          /* 높이값을 body와 같게 함 */
          height: 100%;
        

          /* 
          [배경을 여러개 넣으려면 한번에 셋팅하는 background속성을 이용하여 콤마로 연결한다]
          background: 색이반고윙/크;
          background: 배경색 이미지 반복 고정 위치/크기; 
          ->배경크기를 %로 쓰면 현재 박스 크기의 비율이다.
           */

           background: 
           
           /* 공유 */
           url(./imgs/dc1.png) no-repeat left top/300px,
           /* 김고은 */
           url(./imgs/dc2.png) no-repeat right top/300px,
           /* 이동욱 */
           url(./imgs/dc3.png) no-repeat right 15%/300px,
           /* 유인나 */
           url(./imgs/dc4.png) no-repeat left 15%/300px,
           /* 추가 */
           url(./imgs/bg_logo_a_02.png) no-repeat center 5%/300px,
           /* 메인포스터 */
           url(./imgs/도깨비포스터.jpg) no-repeat fixed center/50%,
           /* 배경 추가. 위치값 50%는 센터와 같다 */
           url(./imgs/eachBG.jpg) no-repeat 50% top/70% 100%;
        
        }
          
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>01-1.배경넣기 연습</h1>
    </div>
  </body>
</html>
