<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>트랜지션 연습</title>
    <style>
        /* css 코드구역 */
        html, body{
            height: 100%;
        }
        body{
            background-image: linear-gradient(to bottom, rgb(255, 201, 242), rgb(255, 224, 248) 30%, rgb(231, 168, 221) 60%);

        }

        /* 애니박스 */
        .ani-box{
            /* 부모자격 */
            position: relative;
            top: 10%;
            /* 비율박스 설정 */
            padding-top: 30%;
            /* height: 400px; 높이 지우고 탑을 비율로 바꾸고 패딩탑넣어줌 */
            /* 블록은 옆으로 끝까지 가니까 w 값 줄필요없음 */

            /* 체크박스 선택해서 태우고 나갔을 때 자식요소 안보이게 숨기기 */
            overflow: hidden;

            outline: 2px solid rgb(5, 86, 192);
        }

        /* 공유어깨 박스 */
        #man-box{
            position: absolute;
            /* 공유가 처음에 나가서 안보임 */
            left: 0%;
            /* 만약 원본이미지가 세로로 길어서 바텀이 0이면 위로 뜨고 픽셀음수로 수치조정해야함 */
            bottom: 0%;
            /* 가로세로크기는 내가 넣은 공유이미지에 따라 조절 브라우저에서 f12누르고
            직접찍어서 값 스크롤해서 조정하면 편함! */
            /* width: 504px; */
            /* height: 399px; */
            /* 픽셀로 했다가 퍼센트로 바꿨슨..
            width의 %값은 부모요소의 width에 대한 비다. 부모크기에 대한 40%란뜻임 */
            width: 40%;
            padding-top: 30%;
            /* 높이값이 없는 박스에서 패딩탑값이 퍼센트면 
            본 박스의 width크기에 대한 %다!!!!
            패딩의 속성을 기억해...  */

            /* 공유가 하츄핑 위에오게 하려고 */
            z-index: 1;

            /* 공유 배경 이미지-> 배경이미지는 css에서 변경가능하기 때문에
            이미지 요소 대신 박스 배경을 사용한다 */
            background: url(./레벨/공유차.png) no-repeat 0/100%;
           

        }
        /* 하츄핑 박스 */
        #ping-box{
            position: absolute;
            bottom: 30%;
            left: 50%;
            width: 13%;
        }

        /* 하츄핑 이미지 조절 */
        #ping-box img{
            /* 부모박스를 채움 */
            width: 100%;
        }

        /* 라벨 디자인- 버튼형 */
        .btn-action{
        
            /* 체크박스가 인라인이어서 마진탑이 안먹힘 
            그래서 위아래마진보더 등 적용하기 위해
            디스플레이 인라인블록으로 바꿈 */
            display: inline-block;
            margin-top: 50px;
            padding: 20px;
            border: 3px solid #fd4179;
            border-radius: 20px;
            background-color: #3b2c36;
            color: #ffffff;
            
            /* 손가락 모양 커서 */
            cursor: pointer;
            
        }
        /* 가상요소로 버튼 글씨 넣기 */
        .btn-action::before{
            content: '💖루미한테 가자!';
            font-size: 20px;
        }
        
        /* 체크박스 체크시 버튼형 라벨 변경하기 */
        #chkbx:checked + .btn-action{
            border: 3px solid #be5ef5;
            background-color: #1d1342;
        }
        #chkbx:checked + .btn-action::before{
            content: '하츄하츄💗';
        }

        /* 체크박스 숨기기 */
        #chkbx{
            display: none;
        }

        /* 체크박스 체크시 man-box 이동 애니
        -> 체크 박스 체크시 다음 형제요소들 중 .ani-box의 
        자손 #man-box 선택 */
        #chkbx:checked ~ .ani-box #man-box{
            /* 오른쪽 바깥으로 슝 나감 */
            left: 100%;
            /* 배경이미지를 태운 걸로 바꿈 */
            background-image: url(./레벨/공유어깨하츄핑.png);
            /* 트랜지션 trs : 4초, 배경이미지는 2초 기다렸다가 .1초동안 다른 이미지로 변경된다 */
            transition: 4s ease-in-out, background-image .1s 2s;
        }

        /* 체크박스 체크시 하츄핑 박스 3초 후 투명하게 변경하기 */
        #chkbx:checked ~ .ani-box #ping-box{
            /* 투명도 op -
             opacity: 0~1사이값 0은 투명 소수점은 반투명 1은 불투명 */
            opacity: 0;
            /* 트랜지션 trs */
            transition: 0.1s 2s;

        }


    </style>
</head>
<body>
    <!-- 체크박스 -->
    <input type="checkbox" id="chkbx">
    <!-- 라벨 -->
    <label for="chkbx" class="btn-action"></label>
    <!-- 체크박스가 라벨의 위에 있어야 함 css는 순서 꼭 생각을 해 
      -->

    <!-- 하츄핑이 공유어깨 타기 애니박스 -->
    <div class="ani-box">
        <!-- 공유 박스 -->
         <div id="man-box"></div>

         <!-- 이미지로 넣으면 src 속성 때문에 css 안돼서 배경이미지로 넣어야함
          백그라운<img src="./레벨/공유차.png" alt="공유어깨" id="man"> -->

         <!-- 하츄핑 박스 -->
          <div id="ping-box">
            <img src="./레벨/하츄핑.png" alt="하츄핑">
          </div>

          <!-- 공유 어깨에 탄 하츄핑 -->
    </div>
</body>
</html>
