<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>03. absolute 포지션</title>
    <style>
      .bx {
        width: 300px;
        height: 300px;
        border: 5px solid rgb(33, 185, 255);
        text-align: center;
        font-size: 24px;
        font-weight: bold; /* fwb */
        /* 글자세로중앙 */
        line-height: 300px;
      }

      /* 첫번째 앱솔루트 박스 */
      #a1 {
        position: absolute;

        /******************************** 
          [ 3. absolute 포지션 ]
            - 절대적인 부모를 기준으로
            위치를 잡는 포지션
            - 부모자격을 따져서 기준을 삼는다!
            (단, 위치속성을 쓴 경우에만!!!)

            1. absolute 포지션은 위치이동값을 쓰기전과
            쓴후로 나눌 수 있다!

              (1) 위치이동값을 쓰지 않은 경우

              - 자기보다 위에 있는 static한 요소를 
              존중하여 그 아래 위치함!!!
              (->>>> 젠틀앱솔루트!!!: 젠틀하다고 이해하란 뜻이지 공식명칭아님)

              - 어떤 요소의 자식요소로 앱솔루트가 셋팅된 경우
              그 부모박스에 부모자격이 없을지라도!!!!!!
              그 위치를 그대로 유지한다!
              (->>>> 젠틀앱솔루트!!!)

              + 앱솔루트 요소보다 아랫쪽에 위치하고 있는
              static한 요소는 앱솔루트를 인식하지 못하여
              같은 자리에 올라와 자리를 차지한다!
              (줄서있다가 날아오른 아이언맨!)

              (2) 위치 이동값을 사용한 경우

              - 위치 이동값을 사용한 부분에 대해서만!!!
              앱솔루트가 위치를 잡을때 기준이 되는
              부모는? static이 아닌 요소가 부모다!

              static이 아닌 포지션은?
              relative / absolute / fixed / sticky

              -> 위치 이동값을 쓰지 않는 부분에 대해서는
              부모를 찾지 않는다!!!(젠틀함!!!)

              -> 부모자격이 있는 부모요소들 중 가장 가까운 것이 부모다!

              -> 만약 부모자격이 모두 없으면 보이는 화면
              (window)을 기준한다!
              (보이는 화면은 body가 아니다! 스크롤이
              생겨도 스크롤 위쪽 보이는 화면을 지칭한다!)

              -> 또한!
              width나 height 값을
              %단위로 줄 경우 부모자격을 가진 요소를
              기준으로 그 크기를 잡는다!
              (일반적으로 %단위의 크기는 바로 싸고 있는
              직계부모박스를 기준한다!)

      ********************************/

        height: 700px;
        background: url(../레벨/조이1.jfif) no-repeat center/cover;
      }

      /* 앱솔루트를 주면 위로 날아올라 그 빈자리엔 아래있던게 깔림?
      현재 있던 자리에서 날아올라/으엥? 헷갈려요? */

      /* 두번째 앱솔루트 박스 ->위치값을 주면 부모를 찾음
      ->자식을 싸고 있는 모든 요소가 부모자격이 없으면
      스크롤 상단 보이는 화면이 부모가 된다*/
      #a2 {
        position: absolute;
        width: 650px;
        /* 오른쪽 아래 0 위치 부모는? 보이는 화면 */
        right: 0;
        bottom: 0;
        background: url(../레벨/레벨단체.jpg) no-repeat center/cover;
      }

      #r1 {
        /* 포지션 relative : por */
        position: relative;

        /* 위로부터 100px : t100 */
        top: 260px;

        /* 왼쪽으로부터 100px : l100 */
        left: 50px;

        /* 원래있던 자리에서 이동했는데 주변을 안 망가뜨려?!!
            다른 걸 밀어서 이동하는게 아님. 내 원래 위치도 보존이 됨
            트랜스폼 나오기 전까지 애니메이션 효과 줄려고 진짜 많이썼대 */

        /************************************* 
                [ 2. relative 포지션 ]
                 - 렐러티브! 라고 읽어주세요!
                 
                 
                 XXXXXXX릴레이티브XXXXXXXX아니고 
                 ooooooooooooooo렐러티브ooooooooo@@@

                
            렐러티브의 특징~
            1. 위치이동속성이 적용된다

            2. 위치 이동의 기준은 원래 있던 위치!
            (그래서 상대적인, 즉 렐러티브라는 단어를 쓴다)

            3. 이동시 다른 요소에 영향이 없이 겹쳐질 수 있다
            (겹쳐질 때 위치 관계는 항상 static보다 위로 올라온다
            다른 포지션은 나중에 코딩된 요소가 위로 올라온다
            static은 다 밑에 깔린다는 거지 뭐)

            4. 원래 위치가 그대로 보존된다(중요!!!- 내가 집을 나와도 우리집이 그대로 있음)
            (***의미: 기존 위치가 보존되기 때문에 
            본래의 디자인이 망가지지 않는다!!!)

            5. 위치값 설정시 한 방향당 한 가지 기준으로만 세팅한다. 
            -> 수평방향은: left/ right 중 하나 선택,
            수직방향은 top/ bottom 중 하나 선택
            ->> 한 방향에서 두가지를 같이 쓰면 top, left가 우선함!!!!
            
             left: 100px은 원래 있던 위치의 왼쪽선에서부터 100px 떨어진다 
                즉 양수값을 주면 내가 보기에는 오른쪽으로 , 음수값을 주면 왼쪽으로 이동하는 거


            양수값이면 안쪽으로, 음수값이면 밖으로 향함

            6. 여기에 마진을 넣는다면?
            마진 적용 그대로 되고, 다른 static 요소에 영향을 미친다.
            -> 본래 위치에서 마진을 적용한 것과 같음.

            7. 렐러티브 위치 이동값을 안 쓰면
            staic과 일반적인 배치가 똑같다!!

            8. relative는 겹쳐질 수 있으므로 위아래 관계가 성립한다!!

                기본적인 위치 관계는 아래와 같다. 
                1) relative는 static보다 항상 위
                2) static를 제외한 포지션인 경우
                    나중에 그려진 요소가 위로 올라온다
                3) z-index 속성으로 숫자가 크면 위!! (z축은 쓰리디)
                (주의!! 숫자 비교는 같은 레벨에서 비교함. 형제들차원에서 )

                0층에 다 같이 잇음. 근데 z-index: 1을 주면 다른 것보다 위로 감
                -1 음수를 쓰면 static보다 내려갈수잇음
                근데 0층이 바디 기본층인데 더밑으로 내려가면... 짱!신기


            9. 부모 자격 


            ___________________________________

                [ z-index 란? ]
                -> static이 아닌 포지션만 적용됨!

                - 겹치는 포지션을 준 경우 위치순서를 
                정하여 위아래 디스플레이를 변경하는 속성

                - z 는 화면방향의 축을 의미함
                - 기본값은 0 -> 같은 층의 모든 기본 요소는 0임!
                - 숫자를 비교하여 큰 숫자가 위에 위치함!

                -> 기본값 0이므로 마이너스값은 static요소보다
                아래로 내려감!(직접선택툴로 안만져지는 이유는
                body보다 아래에 있어서 그렇다!)

                ((유의사항))
                z-index비교시에 형제레벨에서 먼저 비교하고
                그 다음 하위 자손에서 비교하기 때문에
                여러부분에 z-index를 주게 되면 위아래 관계가
                복잡해져서 정리가 어려워진다! 남발하지 말자!

                _______________________________

                 [ 위치이동속성 ]
                - 선택요소의 위치를 이동시켜주는 설정 속성
                - 포지션에 따라서 다르게 적용됨
                - 종류 : 4가지
                    top, bottom, left, right


            *************************************/

        background: url(../레벨/572180_246763_4411.jpg) no-repeat center/cover;
      }
      #r2 {
        /* 포지션 relative */

        background: url(./images/space.jpg) no-repeat center/cover;
      }

      /* 첫번째 박스에 포지션 체크 */
      #s1 {
        background-color: rgb(5, 39, 88);
      }
      #s2 {
        background-color: lightcoral;
      }

      /* 제목넣기 : 렐러티브로! */
      h1.tit {
        position: relative;
        left: 30%;
        width: 40%;
        text-align: center;
        margin: 0;
        padding: 20px;
        border: 4px solid #ff2b2b;
        border-radius: 20px;
        background-color: #ffffff;
        color: #ff0000;
        box-shadow: 2px 2px 20px #776f6fc7;

        /* 글자세팅 */
        color: #ffffff;
        font-size: 45px;
        line-height: 100px;
        font-family: Pretendard, sans-serif;

        /* 글자테두리 */
        /* 웹킷은 글꼴에 따라 이상함 -webkit-text-stroke: 1px rgb(0, 0, 0); */
        text-shadow: 4px 0px rgb(255, 0, 0),
        -4px 0px rgb(49, 48, 48),
        0px 4px rgb(243, 91, 91), 
        0px -4px rgb(0, 0, 0);
      }

      /* 부제목 꾸미기 */
       h2.sub-title {
        /* 포지션, 위치 */
        position: absolute;
        top: 4.8%;
        left: 59%;

         /* 글자세팅 */
        color: #ff4545;
        font-size: 30px;
        line-height: 100px;
        font-family: Pretendard, sans-serif;

        text-shadow:  
        3px 0px rgb(48, 47, 47);
      
       }

      /* 부모를 찾는 앱솔루트! */
      .bx2 {
        border: 2px dotted orangered;
        padding: 50px;
        font-size: 24px;
        text-align: center;
      }
      /* 각 부모박스 */
      .s5 {
        position: relative;
        background-color: lightblue;
      }
      .s6 {
        position: relative;
        background-color: lightcoral;
      }
      .s7 {
        position: relative;
        background-color: lightgreen;
      }
      .s8 {
        position: relative;
        background-color: lightsalmon;
      }

      /* 부모를 찾는 앱솔루트 박스 */
      .abs {
        position: absolute;
        width: 100px;
        height: 50px;
        color: #fff;
        background: url(./images/car.png) no-repeat center/contain;
      }

      /* .a4는 위치이동값을 사용하자! -> 부모찾아 삼만리! */
      .a4 {
        /* 앱솔루트는 .abs에서 이미 셋팅! */
        top: 0;
        left: 0;
        /* 나의 부모는? 포지션이 있는 요소! .s8 */

        /* 앱솔루트 요소 크기를 %로 줄경우
            부모자격 박스를 기준하여 설정된다!!! */
        width: 25%;
        height: 40%;

        /* bd*/
        border: 10px dotted darkblue;
      }

      /* span을 앱솔루트로 만들경우! */
      .spabs{
        /* 포지션 앱솔루트 poa */
        position: absolute;
        bottom: 0;
        right: 0;
        /*나의 부모는? =   .s8 */

        /* 아웃라인ol */
        outline: 4px dotted #023d5f;
      }

      /* 앱솔루트 판타롱스타킹 
      -> 앱솔루트 박스에 width, height를 주지 않아도 내용물 만큼
      자동으로 크기가 생성된다!! 내용물에 달라붙는다잉*/
      .a5{
        position: absolute;
        right: 30%;
        top: 20%;
        /* 부모는 누구? 보이는 화면*/

        /* 아웃라인 */
        outline: 4px solid rgb(186, 159, 248);
        max-width: 300px;
        
      }
     /* 이미지가 박스에 단독으로 들어갈 경우
     하단에 생기는 공백을 없애기 */
      .a5 img{ 
        vertical-align: middle;
        /* 인라인요소가 세로정렬 속성인
        vertical-align의 값을 top/middle/bottom 중 
        어떤 값을 사용해도 하단 공백을 없애는 효과가 있다.
        땡기는 효과가 있음.
        공통적으로 적용하는게 참 좋겠지!
        단, baseline은 효과가 없다 */
        max-width: 300px;


      }
      
      /* 앱솔루트끼리는 서로 겹친다!- 예리 아이린 이미지 두개를 겹치게 */
     /* 포지션을 주고, 박스에 위치값을 안주면 앱솔루트가 가만히 제자리에 잇어서 편하다 */
       .absolute-images {
        position: absolute;
         height: 600px;
         width: 400px; 
          top: 40%;
              left: 30%;

              border: 5px solid rgb(192, 59, 59);
        }

        .absolute-images img {

          position: absolute;
          /* 이미지사이즈 달라서 가로100퍼세로100퍼로 설정해도 
          이미지 찌그러지지 않기 위해 오브젝트 핏 커버 설정함 */
              height: 100%;
              width: 100%;
              object-fit: cover;
              z-index: 1;
             
      }


      /* 두번째 이미지만 투명하게 하기 */
      .absolute-images img:nth-child(2) {
        opacity: 0;
        /*  trs */
        transition: .3s;
      }
      /* 싸고있는 박스에 마우스 오버시 두번째 이미지 등장 즉 투명도1 */
       .absolute-images:hover img:nth-child(2) {
        opacity: 1;
       }



       /* 앱솔루트 위치값으로 크기만들기 */
       .car-box{
        position: absolute;
        top: 0;
        left: 0;
        /* 부모는 보이는 화면! */

        /* 가로크기 - 부모의 25%*/
         width: 25%;
         border: 4px solid rgb(255, 56, 155);
         border-radius: 5px;
       }
       /* 자동차 이미지 */
       .car-box img{
        width: 100%;
        /* 이미지는 한쪽 크기만 주면 나머지 방향크기는
        자동비율유지함! */
       }

       /* 자동차 앱솔루트 타이틀 박스  */
       .car-box h3{
        position: absolute;
        /* 위치값으로 부모가로크기를 채우게함!
        동적 크기 생성! 모바일에서 많이씀 */
         left: 0;
         right: 0;

        bottom: 0;
        /* 부모는 .car-box */
        border: 4px solid rgb(0, 0, 0);

        /* 글자중앙정렬 */
        text-align: center;

        /* 기본마진없애기 */
        margin: 0;
       }


       /* 윈터 추가 */
       .winter-box{
        position: absolute;
        top: 0;right: 0;

        width: 20%;
       }

       .winter-box img{
        width: 100%;
       }

       

    </style>
  </head>
  <body>
    <!-- 제목 -->
    <h1 class="tit">Absolute 포지션</h1>
    <div class="bx" id="r1">r1</div>
    <div class="bx" id="s1">s1</div>

    <!-- 부제목 -->
     <!-- <h2>w.Red Velvet</h2> -->
      <h2 class="sub-title">
        w.Red Velvet
      </h2>

    <!-- 첫번째 앱솔루트 박스 -->
    <div class="bx" id="a1">a1</div>

    <div class="bx" id="r2">r2</div>
    <div class="bx" id="s2">s2</div>

    <!-- 두번째 앱솔루트 박스 -->
    <div class="bx" id="a2">a2</div>

    <!-- 앱솔루트 판타롱스타킹! -->
     <div class="a5" title="앱솔루트 스타킹!"> <img src="../레벨/하츄핑.jpg" alt="타노스"></div>


     <!-- 앱솔루트끼리는 서로 겹친다! -->
      <div class="absolute-images">
        <img src="../레벨/예리.jpg" alt="레드벨벳">
        <img src="../레벨/아이린.jpg" alt="아이린">
      </div>


      <!-- /* 앱솔루트 위치값으로 크기만들기 */ -->
      <div class="car-box"><img src="../레벨/공유어깨하츄핑.png" alt="공유차">
      <!-- 위치값으로 크기 만들 타이틀 박스 -->
       <h3>😎공유핑🚗</h3>
      </div>

      <div class="winter-box"><img src="../레벨/윈터손하츄핑.webp" alt="윈터와하츄핑"></div>

    <!-- 부모를 찾는 앱솔루트! -->
    <div class="bx2 s5">
      s5
      <div class="bx2 s6">
        s6
        <div class="bx2 s7">
          s7
          <div class="bx2 s8">
            s8
            <!-- 박스내부 앱솔루트 -->
            <div class="abs a3" title="나는 젠틀앱솔루트다!">a3</div>

            <div class="abs a4" title="나는 부모찾아 올라간다!">a4</div>

            <span class="spabs" title="자동블록전환!">
              나는 span앱솔루트다!
            </span>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
