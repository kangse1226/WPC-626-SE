<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>03. absolute 포지션</title>
    <style>
      .bx {
        width: 300px;
        height: 300px;
        border: 2px solid blue;
        text-align: center;
        font-size: 24px;
        font-weight: bold; /* fwb */
        /* 글자세로중앙 */
        line-height: 300px;
      }


      /* 첫번째 앱솔루트 박스 */
      #a1{
        position: absolute;
        background: url(./images/ab1.jpg) no-repeat center/cover;
      }

      /* 앱솔루트를 주면 위로 날아올라 그 빈자리엔 아래있던게 깔림?
      현재 있던 자리에서 날아올라/? */

      /* 두번째 앱솔루트 박스 */
      #a2{
        position: absolute;
        background: url(./images/ab4.jpg) no-repeat center/cover;
      }

      #r1 {
        /* 포지션 relative : por */
        position: relative;

        /* 위로부터 100px : t100 */
        top: 100px;

        /* 왼쪽으로부터 100px : l100 */
        left: 100px;

        /* 원래있던 자리에서 이동했는데 주변을 안 망가뜨려?!!
            다른 걸 밀어서 이동하는게 아님. 내 원래 위치도 보존이 됨
            트랜스폼 나오기 전까지 애니메이션 효과 줄려고 진짜 많이썼대 */

        /************************************* 
                [ 2. relative 포지션 ]
                 - 렐러티브! 라고 읽어주세요!
                 
                 
                 XXXXXXX릴레이티브XXXXXXXX아니고 
                 ooooooooooooooo렐러티브ooooooooo@@@

                
            렐러티브의 특징~
            1. 위치이동속성이 적용된다

            2. 위치 이동의 기준은 원래 있던 위치!
            (그래서 상대적인, 즉 렐러티브라는 단어를 쓴다)

            3. 이동시 다른 요소에 영향이 없이 겹쳐질 수 있다
            (겹쳐질 때 위치 관계는 항상 static보다 위로 올라온다
            다른 포지션은 나중에 코딩된 요소가 위로 올라온다
            static은 다 밑에 깔린다는 거지 뭐)

            4. 원래 위치가 그대로 보존된다(중요!!!- 내가 집을 나와도 우리집이 그대로 있음)
            (***의미: 기존 위치가 보존되기 때문에 
            본래의 디자인이 망가지지 않는다!!!)

            5. 위치값 설정시 한 방향당 한 가지 기준으로만 세팅한다. 
            -> 수평방향은: left/ right 중 하나 선택,
            수직방향은 top/ bottom 중 하나 선택
            ->> 한 방향에서 두가지를 같이 쓰면 top, left가 우선함!!!!
            
             left: 100px은 원래 있던 위치의 왼쪽선에서부터 100px 떨어진다 
                즉 양수값을 주면 내가 보기에는 오른쪽으로 , 음수값을 주면 왼쪽으로 이동하는 거


            양수값이면 안쪽으로, 음수값이면 밖으로 향함

            6. 여기에 마진을 넣는다면?
            마진 적용 그대로 되고, 다른 static 요소에 영향을 미친다.
            -> 본래 위치에서 마진을 적용한 것과 같음.

            7. 렐러티브 위치 이동값을 안 쓰면
            staic과 일반적인 배치가 똑같다!!

            8. relative는 겹쳐질 수 있으므로 위아래 관계가 성립한다!!

                기본적인 위치 관계는 아래와 같다. 
                1) relative는 static보다 항상 위
                2) static를 제외한 포지션인 경우
                    나중에 그려진 요소가 위로 올라온다
                3) z-index 속성으로 숫자가 크면 위!! (z축은 쓰리디)
                (주의!! 숫자 비교는 같은 레벨에서 비교함. 형제들차원에서 )

                0층에 다 같이 잇음. 근데 z-index: 1을 주면 다른 것보다 위로 감
                -1 음수를 쓰면 static보다 내려갈수잇음
                근데 0층이 바디 기본층인데 더밑으로 내려가면... 짱!신기


            9. 부모 자격 


            ___________________________________

                [ z-index 란? ]
                -> static이 아닌 포지션만 적용됨!

                - 겹치는 포지션을 준 경우 위치순서를 
                정하여 위아래 디스플레이를 변경하는 속성

                - z 는 화면방향의 축을 의미함
                - 기본값은 0 -> 같은 층의 모든 기본 요소는 0임!
                - 숫자를 비교하여 큰 숫자가 위에 위치함!

                -> 기본값 0이므로 마이너스값은 static요소보다
                아래로 내려감!(직접선택툴로 안만져지는 이유는
                body보다 아래에 있어서 그렇다!)

                ((유의사항))
                z-index비교시에 형제레벨에서 먼저 비교하고
                그 다음 하위 자손에서 비교하기 때문에
                여러부분에 z-index를 주게 되면 위아래 관계가
                복잡해져서 정리가 어려워진다! 남발하지 말자!

                _______________________________

                 [ 위치이동속성 ]
                - 선택요소의 위치를 이동시켜주는 설정 속성
                - 포지션에 따라서 다르게 적용됨
                - 종류 : 4가지
                    top, bottom, left, right


            *************************************/

        background: url(../images/capma.png) no-repeat center/cover;
      }
      #r2 {
        /* 포지션 relative */

        background: url(./images/space.jpg) no-repeat center/cover;
      }

      /* 첫번째 박스에 포지션 체크 */
      #s1 {
        background-color: lightgreen;
      }
      #s2 {
        background-color: lightcoral;
      }

      /* 제목넣기 : 렐러티브로! */
      h1.tit {
        position: relative;
        left: 30%;
        width: 40%;
        text-align: center;
        margin: 0;
        padding: 20px;
        border: 4px solid #2b7b85;
        border-radius: 20px;
        background-color: #18555d;
        color: #ece9e9;
        box-shadow: 2px 2px 20px #776f6fc7;
        font-size: 40px;
        font-family: sans-serif;
      }
    </style>
  </head>
  <body>
    <!-- 제목 -->
    <h1 class="tit">Absolute 포지션</h1>
    <div class="bx" id="r1">r1</div>
    <div class="bx" id="s1">s1</div>

    <!-- 첫번째 앱솔루트 박스 -->
    <div class="bx" id="a1">a1</div>

    <div class="bx" id="r2">r2</div>
    <div class="bx" id="s2">s2</div>

    <!-- 두번째 앱솔루트 박스 -->
    <div class="bx" id="a2">a2</div>

    <!-- 
    [ 젠코딩(에밋코딩) ]

    .bx#s${s$}*3 
    ___________________

    . : 클래스
    # : 아이디
    $ : 증가숫자자리
    *숫자 : 반복생성횟수
    {} : 데이터출력(꺽쇠사이값)
    [] : 속성셋팅값
    > : 하위직계 자식요소
    + : 형제요소
    () : 요소 구분하기     
    ______________________
    ((샘플))
    header.my#key[title=hi]{메뉴}*2

    ul>li*3>a*4

    div.my#my$*2>section+article>img
    -->
  </body>
</html>
