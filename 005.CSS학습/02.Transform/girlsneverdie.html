        /* 트랜지션  trs
        - 박스에 안주고 이미지에게 주는 이유:
        그럼 이벤트가 잘 안먹어서..  */
        /* 0.6s앞에 all이 생략되어있는거임! */
      
     /**********************************************   
      [ Transform 효과주기 ]

      
        0.  트랜지션 시간 늘리기
          transition: 5s ease-in-out;
        /**********************************************   
         1. transform : rotateY(Y축 각도deg) - Y축회전
            - deg 는 각도의 단위(도:degree)

            [ 각도 단위 확장 ]
            (1) deg: 도 단위 (360 deg는 한 바퀴 회전)
            (2) grad: 그라디언트 (400 grad는 한 바퀴 회전)
            (3) rad: 라디안 (2π rad는 한 바퀴 회전)
            (4) turn: 턴 (1 turn은 한 바퀴 회전)

         2. transform : rotateX(각도deg) - X축회전
            - deg 는 각도의 단위(도:degree)

         3. transform : translateX(거리) - X축이동
            - 단위 : px, % 등
            - 현재 위치로부터 이동
            - 기준점은 요소의 왼쪽
            - % 단위를 쓸경우 기준은 요소의 width값
            - 이동방향: + 오른쪽, -는 왼쪽
          #transform-box3:hover img{
           x축이동 tftx 
           내크기의 50%만큼 왼쪽으로 이동 
           transform: translateX(-132%); 
            -> %단위 기준은 항상 자기자신의 크기다!! 
            
            
           4. transform : translateY(거리) - Y축이동
            - 단위 : px, % 등
            - 현재 위치로부터 이동
            - 기준점은 요소의 윗쪽
            - % 단위를 쓸경우 기준은 요소의 height값
            - 이동방향: + 아랫쪽, -는 윗쪽

           5. transform : translate(x축거리,y축거리) - X,Y축이동
          - 단위 : px, % 등
          - 현재 위치로부터 이동
          - 기준점은 요소의 윗쪽, 왼쪽선
          - % 단위를 쓸경우 기준은 요소의 
            width,height값
          - 이동방향: + 오른쪽/아랫쪽, -는 왼쪽/윗쪽

            y축이동 tfty 
             내높이의 200%만큼 윗쪽으로 이동 
            transform: translateY(-150%);
             -> %단위 기준은 항상 자기자신의 크기다!!
            
            %단위 기준은 항상 자기자신의 크기다!! 
           translate: -100% -> x축 이동; 
           translate: 0 -100%  -> y축 이동; 
           translate: -100% -100%;  
           x,y축 동시 이동 
           {opacity: .5;} *
           
           6. rotate(각도deg) - 원형회전
            - 각도의 숫자가 양수이면 시계방향
            음수는 반시계방향

            - 기본회전축은 정중앙
            (변경가능: transform-origin)
           
            [ 트랜스폼 회전축 변경속성 ]
                transform-origin: 가로 세로;
                - 가로값 : left, right, center, 몇px,몇%
                - 세로값 : top, bottom, center, 몇px,몇%
                - 기본값 : 가로, 세로 center임! 

            rotate도 독립햇다..!
           원형회전 tfr
           transform: rotate(4587deg);
           rotate: 4563deg;
           rotate: x 4563deg;
           rotate: y 4563deg;

            [rotate 속성]
           rotate: 각도; -> 평면회전
           rotate: x 각도;  -> x축회전
           rotate: y 각도; ->  y축회전
           rotate: z 각도; ->  z축회전

           참고: 축회전조합하기
           rotate : 숫자 숫자 숫자 각도
           -> 숫자에 1을 쓰면 순서대로 x,y,z축 사용 표시
           -> 숫자에 0을 쓰면 순서대로 x,y,z축 미사용 표시
           예를 들어,
           rotate: 1 1 0 45deg;
           -> x,y축 동시 45도 회전
           
           rotate: 1 1 1 180deg;
           -> x,y,z축 동시 180도 회전


           복합설정
           #transform-box10:hover img{
           transform: scale(2)
           skew(300deg, 400deg);
           rotate(100%, 200%);
           transition-duration: 30s;
         }
           */

      #transform-box1:hover img {
        transform: translate(380%, -120%);
        /* transition: 2s; */

      }

        #transform-box3:hover img{

        #transform-box5 img:hover{

        /* 상단 로고- 뒤집어지는 애니박스 */
              .transform-special{
                position: absolute;
                top: 10%;
                left: 45%;
    
                /* 부모는? 보이는 화면! */

              }
              /* 유정이랑 보검이 이미지가 겹쳐지게 앱솔루트 세팅 */
              .transform-special img{
                position: absolute;
                width: 200px;
                height: 200px;
                /* border-radius: 50%; */
              }

              /* 1) 첫번째 img 자식- 유정이 원본(돌아올 때). */
              .transform-special img:first-child{
                /* 처음에 90도로 돌려서 숨겨둠 */
                transform: rotateY(90deg);
                /* 트랜지션 다시 돌아갈 때 바로 출발,
                처음만 천천히 */
                transition: .4s ease-in;
              }
              /* 2) 첫번째 img 자식- 유정이 오버시. */
              .transform-special:hover img:first-child{
                /* 오버시 0도가 되어 보여짐 */
                transform: rotateY(0deg);
                /* 트랜지션 - 보검이 돌동안 .4초 기다렸다가
                그대로 받아서 끝에 천천히*/
                transition: .4s ease-out .4s ;
              }
              
              /* 3) 마지막째 img 자식은 관식이. 보검이 원본(돌아올 때) */
              .transform-special img:last-child{
                /* 처음에 0도여서 보임 */
                transform: rotateY(0deg);
                /* 트랜지션: 돌아올 때 유정이 .4초 기다려, 
                그대로 받아서 끝에 천천히 ease-out */
                transition: .4s ease-out .4s;
              }
              /* 4) 마지막째 img 자식은 관식이. 보검이 오버시 */
              .transform-special:hover img:last-child{
                /* 오버시 90도로 돌아서 안보여짐 */
                transform: rotateY(90deg);
                /* 트랜지션 기다릴 필요 없이 바로 출발,
                이징은 처음만 천천히 =ease-in */
                transition: .4s ease-in;
              }



              /* 자바스크립트 하기 전에 임시로 라디오버튼 만들어서 배경 변경하기 */
              .bg-box{
                position: fixed;
                top: 0;
                right: 0;
                bottom: 0;
                left: 0;
                z-index: -1;
              }
              .bg-box img{
                position: fixed;
                top: 0;
                left: 0;
                z-index: 999;
                width: 100%;
                height: 100%;
                object-fit: cover;
                opacity: 0;
                transition: 0.6s;
              }
              .bg-box img:first-of-type{
                opacity: 1;
              }

              .bg-box input {
                display: none;
              }
              .btn-box{
                position: absolute;
                z-index: 1;
                padding: 20px;
              }
              .btn-box label{
                font-style: italic;
                font-family: Pretandard;
                color: #fff;
                padding: 10px 15px;
                background-color: rgb(188, 212, 185);
                border: 4px solid rgb(204, 247, 222);
                border-radius: 50%;
              }

              .bg-box #chk2:checked ~ img:nth-of-type(2) {
                opacity: 1;
              }

              .bg-box #chk3:checked ~ img:nth-of-type(3) {
                opacity: 1;
              }

              .bg-box #chk4:checked ~ img:nth-of-type(4) {
                opacity: 1;
              }
              .bg-box #chk1:checked ~ img:nth-of-type(2) {
                opacity: 0;
              }
              .bg-box #chk1:checked ~ img:nth-of-type(3) {
                opacity: 0;
              }
              .bg-box #chk1:checked ~ img:nth-of-type(4) {
                opacity: 0;
              }

       
    </style>
