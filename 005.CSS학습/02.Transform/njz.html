<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 탭메뉴 아이콘 넣기 -->
    <link
      rel="shortcut icon"
      href="../뉴진스/바니.jfif"
      type="image/ico"
    />
    <title>NJZ</title>
    <!-- 트랜스폼 샘플사이트
     https://tombap8.github.io/FED-RV-TOM-2024/002.HTML%ED%95%99%EC%8A%B5/05.Transform_PJ/index.html -->
    <style>
      /* 전체 배경 넣기 */
      body {
      
        /* 배경이미지  */
        /* 1. 이미지  */
        background-image: url(../뉴진스/뉴진스단체\ \(22\).jpg);
        /* 2. 반복여부 */
        background-repeat: no-repeat;
        /* 3. 고정 @질문: 고정안해도 뭐가 달라지는 걸 모르겠음..??? ㅠㅠ*/
        background-attachment: fixed;
        /* 4. 위치: 가로 x축 세로 y축 
                가로값- left(기본값), right, center, 수치값
                세로값- top, bottom, center(기본값), 수치값*/
        background-position: center top;
        /* bg-p에서 center만 쓰면 정가운데 (center 뒤에오는 center는 생략) */
        /* 5. 크기: 가로width 세로 height
            - 특이한 값들
            1) contain: 배경이미지가 모두 보임(비율에 맞게) 
            2) cover: 비율에 맞게 대상박스의 빈공간이 없음!!
            3) 모두 채운 후 비율없이 만드는 방법 그러나 쓰진 않음 100% 100% 
            */
        /* 크기 조절안하면 원본이미지 사이즈로 됨 */
        background-size: cover;
        /* bgz를 100% 100% 이따구로 해서 찌그러뜨리면 혼남 */
      }
      /* 1. 제목 */
      .main-title {
        /* 박스세팅 */
        max-width: 700px;
        text-align: center;
        background-color: #ffffff6c;
        
        /* 글자세팅 */
        color: #ffffff;
        font-size: 45px;
        line-height: 100px;
        font-family: Pretendard, sans-serif;

        /* 글자테두리 */
        text-shadow: 4px 0px rgb(150, 235, 147),
        -4px 0px rgb(10, 155, 53),
        0px 4px rgb(5, 128, 46), 
        0px -4px rgb(113, 177, 113);
      }

      /* 전체부모박스 */
      .main-contents {
        /* 박스세팅 */
        max-width: 1500px;
        margin: 500px auto;
        border: 10px solid rgba(255, 241, 241, 0.555);
        border-radius: 0px;
        padding: 30px;

        /* 기본적으로 박스 크기를 잡으면
        그 크기는 컨텐트 영역의 크기임.
        보더와 패딩은 바깥쪽으로 생김
        그래서 박스가 커짐!
        보더, 패딩을 크기 세팅에 포함시킬 필요가 있는 경우에는
        box-sizing:border-box 세팅을 한다  */
        box-sizing: border-box;
        /* 쉽게 생각해서 컨텐트의 width + (보더+패딩 크기)*2  */
      }

      /* 부모박스 가상요소 clear 세팅( float 떄문에) */
      .main-contents::after {
        content: "";
        display: block;
        clear: both;
      }
      /* 캐릭터박스 공통 */
      .main-contents > div {
        /* 옆으로 흐르게  */
        /* 그럼 부모박스가 쪼그라들지롱 */
        float: left;

        /* 등분하기: 한줄에 개씩  */
        width: calc(100% / 3);

        /* 중앙정렬 */
        text-align: center;
      }
      /* 3번 div 이후 자식 마진 탑 주기 */
      .main-contents > div:nth-child(3) ~ div {
        /*  위쪽 마진 */
        margin-top: 30px;
      }

      /* 캐릭터 이미지 공통 */
      .main-contents > div img {
        width: 420px;
        height: 500px;
        object-fit: cover; 
      border-radius: 0%;
      }


        /* 트랜지션  trs
        - 박스에 안주고 이미지에게 주는 이유:
        그럼 이벤트가 잘 안먹어서..  */
        /* 0.6s앞에 all이 생략되어있는거임! */
      
     /**********************************************   
      [ Transform 효과주기 ]

      
        0.  트랜지션 시간 늘리기
          transition: 5s ease-in-out;
        /**********************************************   
         1. transform : rotateY(Y축 각도deg) - Y축회전
            - deg 는 각도의 단위(도:degree)

            [ 각도 단위 확장 ]
            (1) deg: 도 단위 (360 deg는 한 바퀴 회전)
            (2) grad: 그라디언트 (400 grad는 한 바퀴 회전)
            (3) rad: 라디안 (2π rad는 한 바퀴 회전)
            (4) turn: 턴 (1 turn은 한 바퀴 회전)

         2. transform : rotateX(각도deg) - X축회전
            - deg 는 각도의 단위(도:degree)

         3. transform : translateX(거리) - X축이동
            - 단위 : px, % 등
            - 현재 위치로부터 이동
            - 기준점은 요소의 왼쪽
            - % 단위를 쓸경우 기준은 요소의 width값
            - 이동방향: + 오른쪽, -는 왼쪽
          #transform-box3:hover img{
           x축이동 tftx 
           내크기의 50%만큼 왼쪽으로 이동 
           transform: translateX(-132%); 
            -> %단위 기준은 항상 자기자신의 크기다!! 
            
            
           4. transform : translateY(거리) - Y축이동
            - 단위 : px, % 등
            - 현재 위치로부터 이동
            - 기준점은 요소의 윗쪽
            - % 단위를 쓸경우 기준은 요소의 height값
            - 이동방향: + 아랫쪽, -는 윗쪽

           5. transform : translate(x축거리,y축거리) - X,Y축이동
          - 단위 : px, % 등
          - 현재 위치로부터 이동
          - 기준점은 요소의 윗쪽, 왼쪽선
          - % 단위를 쓸경우 기준은 요소의 
            width,height값
          - 이동방향: + 오른쪽/아랫쪽, -는 왼쪽/윗쪽

            y축이동 tfty 
             내높이의 200%만큼 윗쪽으로 이동 
            transform: translateY(-150%);
             -> %단위 기준은 항상 자기자신의 크기다!!
            
            %단위 기준은 항상 자기자신의 크기다!! 
           translate: -100% -> x축 이동; 
           translate: 0 -100%  -> y축 이동; 
           translate: -100% -100%;  
           x,y축 동시 이동 
           {opacity: .5;} *
           
           6. rotate(각도deg) - 원형회전
            - 각도의 숫자가 양수이면 시계방향
            음수는 반시계방향

            - 기본회전축은 정중앙
            (변경가능: transform-origin)
           
            [ 트랜스폼 회전축 변경속성 ]
                transform-origin: 가로 세로;
                - 가로값 : left, right, center, 몇px,몇%
                - 세로값 : top, bottom, center, 몇px,몇%
                - 기본값 : 가로, 세로 center임! 

            rotate도 독립햇다..!
           원형회전 tfr
           transform: rotate(4587deg);
           rotate: 4563deg;
           rotate: x 4563deg;
           rotate: y 4563deg;

            [rotate 속성]
           rotate: 각도; -> 평면회전
           rotate: x 각도;  -> x축회전
           rotate: y 각도; ->  y축회전
           rotate: z 각도; ->  z축회전

           참고: 축회전조합하기
           rotate : 숫자 숫자 숫자 각도
           -> 숫자에 1을 쓰면 순서대로 x,y,z축 사용 표시
           -> 숫자에 0을 쓰면 순서대로 x,y,z축 미사용 표시
           예를 들어,
           rotate: 1 1 0 45deg;
           -> x,y축 동시 45도 회전
           
           rotate: 1 1 1 180deg;
           -> x,y,z축 동시 180도 회전
           */

      #transform-box1:hover img {
      }
        
        #transform-box2 img{
        }
    
      

        /*@@@@@@@@@@@ 타이틀 움직이기 @@@@@@@@@@@*/
        .main-title{
          position: relative;
          left: 0;
          translate: 0 -100%;
        }
        body:hover .main-title{
          translate: 0;
          left: 75%;
           transition: translate 1s ease-in-out,
           left 3s ease-in-out 1s;
        }


        /* 뒤집어지는 애니박스 */
              .transform-special{
                position: absolute;
                top: 30px;
                left: 30px;
    
                /* 부모는? 보이는 화면! */

              }
              /* 유정이랑 보검이 이미지가 겹쳐지게 앱솔루트 세팅 */
              .transform-special img{
                position: absolute;
                width: 100px;
                height: 100px;
                border-radius: 50%;
              }

              /* 1) 첫번째 img 자식- 유정이 원본(돌아올 때). */
              .transform-special img:first-child{
                /* 처음에 90도로 돌려서 숨겨둠 */
                transform: rotateY(90deg);
                /* 트랜지션 다시 돌아갈 때 바로 출발,
                처음만 천천히 */
                transition: .4s ease-in;
              }
              /* 2) 첫번째 img 자식- 유정이 오버시. */
              .transform-special:hover img:first-child{
                /* 오버시 0도가 되어 보여짐 */
                transform: rotateY(0deg);
                /* 트랜지션 - 보검이 돌동안 .4초 기다렸다가
                그대로 받아서 끝에 천천히*/
                transition: .4s ease-out .4s ;
              }
              
              /* 3) 마지막째 img 자식은 관식이. 보검이 원본(돌아올 때) */
              .transform-special img:last-child{
                /* 처음에 0도여서 보임 */
                transform: rotateY(0deg);
                /* 트랜지션: 돌아올 때 유정이 .4초 기다려, 
                그대로 받아서 끝에 천천히 ease-out */
                transition: .4s ease-out .4s;
              }
              /* 4) 마지막째 img 자식은 관식이. 보검이 오버시 */
              .transform-special:hover img:last-child{
                /* 오버시 90도로 돌아서 안보여짐 */
                transform: rotateY(90deg);
                /* 트랜지션 기다릴 필요 없이 바로 출발,
                이징은 처음만 천천히 =ease-in */
                transition: .4s ease-in;
              }
    </style>
  </head>
  <body>
    <!-- 1. 제목 -->
    <h1 class="main-title">NJZ</h1>
    <!-- <h1>구그달 캐릭터 소개</h1>  대신에 h1.main-title로 작성-->
 <!-- 2. 뒤집어지는 애니박스 -->
     <div class="transform-special">
        <img src="../뉴진스/로고 (2).png" alt="2" />
        <img src="../뉴진스/바니.jpg" alt="1" />
      </div>
    <!-- 2. 콘텐츠 박스 -->
    <section class="main-contents">
      <!-- id는 # , transform-box이란 아이디로 만들건데 box 숫자개 만들거면
         $*숫자 쓰면 된다/ 그 밑에 자식으로 img  -->
      <div id="transform-box1"> 
        <img src="../뉴진스/민지 (2).jpg" alt="민지" />
        <span></span>
      </div>
      <div id="transform-box2">
        <img src="../뉴진스/하니 (1).jpg" alt="하니" />
      </div>
      <div id="transform-box3">
        <img src="../뉴진스/다니 (1).jpg" alt="다니" />
      </div>
      <div id="transform-box4">
        <img src="../뉴진스/해린 (1).jpg" alt="해린" />
      </div>
      <div id="transform-box5">
        <img src="../뉴진스/뉴뉴 (2).jpg" alt="로고" />
      </div>
      <div id="transform-box6">
        <img src="../뉴진스/혜인 (2).jpg" alt="혜인" />
      </div>
     
    </section>
  </body>
</html>
