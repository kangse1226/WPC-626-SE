<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>쓸쓸하고 찬란하神 도깨비 드라마 소개</title>

    <!-- 메인 CSS -->
    <link rel="stylesheet" href="./css/main.css" />
  </head>
  <body>
    <!-- 1. 상단영역 -->
    <div id="top-area">
      <header class="top-area inbox">
        <h2 class="temp-tit blind">상단영역</h2>
        <!-- 상단영역 플렉스부모박스 : .cont-box -->
        <div class="cont-box">
          <!-- 상단영역의 .content-box가 플렉스 있는 부모박스가 되고, 
           형제인 로고박스와 메뉴박스는 옆으로 흘러감
          메뉴박스 안의 탑메뉴랑 지엔비메뉴를 같이 그룹으로 묶어주기 
           컨알에이!로 한번에 싼다 -->
           
          <!-- 1-1. 로고박스 -->
           <section class="logo-box">
            <h1 class="logo">
              <a href="#">
                <img src="./images/new_logo.png" alt="tvn 새 로고">
              </a>
            </h1>
           </section>
          <!-- 1-2. 메뉴박스 -->
           <section class="menu-box">
<!-- 탑메뉴와 지엔비메뉴를 그룹으로 묶는다 : 메뉴박스 하위 메뉴그룹박스 -->
            <div class="menu-group">
              <!-- 1-2-1. 탑메뉴 -->
              <nav class="top-menu">
                <!-- ul>li*3>a{탑메뉴} -->
                <ul>
                  <li><a href="">로그인</a></li>
                  <li><a href="">회원가입</a></li>
                  <li><a href="">검색</a></li>
                </ul>
              </nav>
              <!-- 1-2-2. GNB메뉴 -->
              <nav class="gnb-menu">
                <!-- ul>li*9>a{GNB메뉴} -->
                <ul>
                  <!-- 붙이려는 자리 개수와 붙이려는 글자 개수가 같으면 컨트롤 디디디디디로해놓고
                   컨트롤브이하면 각각각가각각 제자리에 잘 붙여짐 마치 한글표에서 값만 붙여넣기하듯이 -->
                  <li><a href="">About tvN</a></li>
                  <li><a href="">편성표</a></li>
                  <li><a href="">채널번호</a></li>
                  <li><a href="">드라마</a></li>
                  <li><a href="">연예오락</a></li>
                  <li><a href="">인사이트</a></li>
                  <li><a href="">동영상</a></li>
                  <li><a href="">이벤트</a></li>
                  <li><a href="">프로그램</a></li>
                </ul>
              </nav>
            </div>
            
           </section>

        </div>
         
      </header>
    </div>

    <!-- 1.5. 드라마파트 메뉴 -->
    <div id="drama-part-menu">
      <nav class="drama-part-menu inbox"></nav>
    </div>

    <!-- 2. 메인영역 (div>main>section 삼중구조)-->
    <div id="main-area">
      <main class="main-area">
        <!-- 2-1. 배너 영역 -->
         <section class="banner-part">
            <h2 class="temp-tit">배너영역</h2>
         </section>

        <!-- 2-2. 캐릭터소개 영역 -->
         <section class="character-part inbox">
            <h2 class="temp-tit">캐릭터소개</h2>
         </section>

        <!-- 2-3. 드라마소개 영역 -->
         <section class="intro-part inbox">
            <h2 class="temp-tit">드라마소개</h2>
         </section>

        <!-- 2-4. 미리보기 영역 -->
         <section class="preview-part inbox">
            <h2 class="temp-tit">미리보기</h2>
         </section>

        <!-- 2-5. 현장포토 영역 -->
         <section class="field-part inbox">
            <h2 class="temp-tit">현장포토</h2>
         </section>

        <!-- 2-6. 대표포스터 영역 -->
         <section class="poster-part inbox">
            <h2 class="temp-tit">대표포스터</h2>
         </section>

        <!-- 2-7. 최신동영상 영역 -->
         <section class="video-part inbox">
            <h2 class="temp-tit">최신동영상</h2>
         </section>

      </main>
    </div>
    <!-- 3. 하단영역 -->
    <div id="bottom-area">
      <footer class="bottom-area inbox">
        <h2 class="temp-tit">하단영역</h2>
      </footer>
    </div>
  </body>
</html>
