<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Swiper demo</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1"
    />
    <!-- Link Swiper's CSS -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"
    />

    <!-- Demo styles -->
    <style>
      html,
      body {
        position: relative;
        height: 100%;
      }

      body {
        background: #000;
        font-family: Helvetica Neue, Helvetica, Arial, sans-serif;
        font-size: 14px;
        color: #fff;
        margin: 0;
        padding: 0;
      }
      /* 스와이퍼 부모박스 */
      .swiper {
        position: relative;
        top: 50%;
        translate: 0 -50%;
        width: 80vw;
        /* aspect-ratio: 5/1; -> 부모에 비율주지말고 개별박스인.swiper-slide에 비율주기 */
        margin: 0 auto;

        /* 선택금지 */
        user-select: none;
        /* 드래그 금지 */
        -webkit-user-drag: none;
      }

      .swiper-slide {
        text-align: center;
        font-size: 18px;
        background: #444;
        display: flex;
        justify-content: center;
        align-items: center;
           /* 개별박스에 비율주기! */
        aspect-ratio: 5/4;
      }

      .swiper-slide img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      /* 버튼박스 */
      .btns-box {
        position: absolute;
        bottom: 20%;
        left: 50%;
        transform: translate(-50%, 0);
        display: flex;
        gap: 5vw;
        background-color: #ffffff00;
      }

      .btns-box button {
        padding: 10px 20px;
        font-size: 1.2rem;
        background-color: #00000000;
        color: #ffffff;
        border: none;
        border-radius: 30px;
        cursor: pointer;
        transition: all 0.3s;
      }

      .btns-box button:hover {
        background-color: #ff3c3c;
        color: #000000;
        transform: scale(1.1);
      }

      /* 이전버튼 처음에 숨기기 */
      .btn-prev {
        display: none;
      }
    </style>
  </head>

  <body>
    <!-- Swiper -->
<!-- Swiper 
      스와이퍼는 3중 박스 구조를 가진다!
      .swiper(부모박스 이름은 자유!)
        ㄴ.swiper-wrapper(클래스명고정!)
          ㄴ.swiper-slide(클래스명고정!)
    -->

    <div class="swiper mySwiper">
      <div class="swiper-wrapper">
        <!-- 16개의 이미지를 포함한 박스로 구성함 -->
        <div class="swiper-slide">
          <img src="./images/clip_img/1.jpg" alt="이미지" />
        </div>
        <div class="swiper-slide">
          <img src="./images/clip_img/2.jpg" alt="이미지" />
        </div>
        <div class="swiper-slide">
          <img src="./images/clip_img/3.jpg" alt="이미지" />
        </div>
        <div class="swiper-slide">
          <img src="./images/clip_img/4.jpg" alt="이미지" />
        </div>
        <div class="swiper-slide">
          <img src="./images/clip_img/5.jpg" alt="이미지" />
        </div>
        <div class="swiper-slide">
          <img src="./images/clip_img/6.jpg" alt="이미지" />
        </div>
        <div class="swiper-slide">
          <img src="./images/clip_img/7.jpg" alt="이미지" />
        </div>
        <div class="swiper-slide">
          <img src="./images/clip_img/8.jpg" alt="이미지" />
        </div>
        <div class="swiper-slide">
          <img src="./images/clip_img/9.jpg" alt="이미지" />
        </div>
        <div class="swiper-slide">
          <img src="./images/clip_img/10.jpg" alt="이미지" />
        </div>
        <div class="swiper-slide">
          <img src="./images/clip_img/11.jpg" alt="이미지" />
        </div>
        <div class="swiper-slide">
          <img src="./images/clip_img/12.jpg" alt="이미지" />
        </div>
        <div class="swiper-slide">
          <img src="./images/clip_img/13.jpg" alt="이미지" />
        </div>
        <div class="swiper-slide">
          <img src="./images/clip_img/14.jpg" alt="이미지" />
        </div>
        <div class="swiper-slide">
          <img src="./images/clip_img/15.jpg" alt="이미지" />
        </div>
        <div class="swiper-slide">
          <img src="./images/clip_img/16.jpg" alt="이미지" />
        </div>
      </div>
      <!-- <div class="swiper-pagination"></div> : 필요없어서 주석처리-->
    </div>
    <!-- 내가 원하는 버튼 만들기 -->
    <div class="btns-box">
      <button class="btn-prev">이전</button>
      <button class="btn-next">다음</button>
    </div>

    <!-- Swiper JS -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

    <!-- Initialize Swiper -->
    <script>
          // 버튼 요소 선택 ///
          const btnPrev = document.querySelector(".btn-prev");
          const btnNext = document.querySelector(".btn-next");

          var swiper = new Swiper(".mySwiper", {
            // 한 화면에 보일 슬라이드 개수
            // breakpoints를 셋팅하면 여기서 셋팅할 필요없음
            // slidesPerView: 4,
            //   슬라이드 간격( 따옴표 없이 숫자면 픽셀단위, )
            // spaceBetween: "20vw",
            //   pagination:페이지를 구성하는 것: 필요없으면 뺀다
            //   pagination: {
            //     el: ".swiper-pagination",
            //     clickable: true,
            //   },

            // 화면크기별 스와이퍼 슬라이드 개수
      // Responsive breakpoints
          breakpoints: {
        // when window width is >= 320px
        320: {
          slidesPerView: 1,
          spaceBetween: 0
        },
        // when window width is >= 480px
        480: {
          slidesPerView: 2,
          spaceBetween: "5vw"
        },
        // when window width is >= 640px
        640: {
          slidesPerView: 3,
          spaceBetween: "10vw"
        },
        // when window width is >= 1000px
        1000: {
          slidesPerView: 4,
          spaceBetween: "20vw"
        },
      }

          });

          // 이전 버튼 클릭시 swiper API를 이용한 코딩하기!
          document.querySelector(".btn-prev").addEventListener("click", () => {
            swiper.slidePrev();
          });

          // 다음 버튼 클릭시 swiper API를 이용한 코딩하기!
          document.querySelector(".btn-next").addEventListener("click", () => {
            swiper.slideNext();
          });

          // 스와이퍼 슬라이드 시작시 발생 이벤트: reachBeginning
         // swiper.on("reachBeginning", () => {
         //   console.log("시작합니다!");
            // 버튼 비활성화 처리하기!
          //  document.querySelector(".btn-prev").style.display = "none";
         // }); ///// reachBeginning //////

          // 스와이퍼 슬라이드 마지막 도달시 발생 이벤트: reachEnd
          //클릭같은 오리지널 이벤트가 아니라, swiper API에서 제공하는 이벤트!
          // 이때 마지막 버튼을 비활성화 처리한다!
         // swiper.on("reachEnd", () => {
          //  console.log("끝에 도달했어요!");
            // 버튼 비활성화 처리하기!
         //   document.querySelector(".btn-next").style.display = "none";
         // }); ///// reachEnd //////

          // 스와이퍼 슬라이드가 변경될때 발생 이벤트는? slideChange
          swiper.on("slideChange", () => {
            console.log("처음이에요!", swiper.isBeginning);
            console.log("끝인가?", swiper.isEnd);
            // 맨처음인가? 맨끝인가?에 따른 분기 //////
            // 1. 맨처음엔 => 이전버튼 비활성화
            if(swiper.isBeginning) {
                btnPrev.style.display = "none";
            } /// if ////

            // 2. 맨끝인가? => 다음버튼 비활성화
            else if(swiper.isEnd) {
                btnNext.style.display = "none";
            } /// else if ////

            // 3. 그밖의 경우는 => 이전버튼, 다음버튼 활성화
            else {
                btnNext.style.display = "inline-block";
                btnPrev.style.display = "inline-block";
            } /// else ////

          }); ///// slideChange //////

         /*
            [스와이퍼 화면 크기별 슬라이드 개수 조정 예시 소스]
            const swiper = new Swiper('.swiper', {
          // Default parameters
          slidesPerView: 1,
          spaceBetween: 10,

          // Responsive breakpoints
          breakpoints: {
            // when window width is >= 320px
            320: {
              slidesPerView: 2,
              spaceBetween: 20
            },
            // when window width is >= 480px
            480: {
              slidesPerView: 3,
              spaceBetween: 30
            },
            // when window width is >= 640px
            640: {
              slidesPerView: 4,
              spaceBetween: 40
            }
          }
        })


          */
    </script>
  </body>
</html>
